---
deployment:
  tasks:
    - export DEPLOYPATH=/home/impalnls/impactvisa
    - mkdir -p $DEPLOYPATH
    - /bin/cp -R * $DEPLOYPATH/
    - mkdir -p /home/impalnls/public_html
    - /bin/cp -R dist/* /home/impalnls/public_html/ || true
    - /bin/cp -R public/* /home/impalnls/public_html/ || true
    - /bin/cp -R dist/* $DEPLOYPATH/ || true
    - mkdir -p $DEPLOYPATH/tmp
    - touch $DEPLOYPATH/tmp/restart.txt

